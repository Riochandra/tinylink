<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✂️ TinyLink · auto-copy shortener</title>
  <!-- Favicon: emoji scissors via SVG data URI (no external file needed) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✂️</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✂️</text></svg>">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: #e2e8f0;
    }

    .card {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 2rem;
      padding: 2.5rem 2rem;
      max-width: 700px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05);
      transition: all 0.2s ease;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
      color: #f1f5f9;
    }

    h1 i {
      color: #3b82f6;
      background: rgba(59, 130, 246, 0.15);
      padding: 0.5rem;
      border-radius: 1rem;
      font-size: 1.8rem;
    }

    .subhead {
      font-size: 1rem;
      color: #94a3b8;
      margin-bottom: 2rem;
      margin-left: 0.2rem;
      border-left: 3px solid #3b82f6;
      padding-left: 1rem;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      background: #0b1220;
      border-radius: 1.2rem;
      border: 1px solid #334155;
      transition: border 0.15s, box-shadow 0.15s;
      padding: 0.2rem 0.2rem 0.2rem 1.2rem;
    }

    .input-wrapper:focus-within {
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.25);
    }

    .input-wrapper i {
      color: #64748b;
      font-size: 1.2rem;
      margin-right: 0.6rem;
    }

    .input-wrapper input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 1rem 1rem 1rem 0;
      font-size: 1rem;
      color: #f1f5f9;
      outline: none;
      font-weight: 400;
    }

    .input-wrapper input::placeholder {
      color: #475569;
      font-weight: 300;
    }

    .shorten-btn {
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 1.2rem;
      padding: 1rem 1.8rem;
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 8px 20px -6px rgba(59, 130, 246, 0.4);
      letter-spacing: 0.3px;
    }

    .shorten-btn:hover:not(:disabled) {
      background: #2563eb;
      box-shadow: 0 12px 24px -8px rgba(59, 130, 246, 0.6);
    }

    .shorten-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .shorten-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .shorten-btn i {
      font-size: 1.2rem;
    }

    .result-area {
      background: #0b1220;
      border-radius: 1.2rem;
      padding: 1.5rem;
      margin-top: 0.5rem;
      border: 1px solid #1e293b;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .result-label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      justify-content: space-between;
    }

    .auto-copy-badge {
      font-size: 0.7rem;
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      padding: 0.25rem 0.7rem;
      border-radius: 2rem;
      font-weight: 500;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      text-transform: none;
    }

    .auto-copy-badge i {
      font-size: 0.7rem;
    }

    .short-url-container {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      background: #1e293b;
      border-radius: 1rem;
      padding: 0.75rem 1rem;
    }

    .short-url-container a {
      color: #60a5fa;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 500;
      word-break: break-all;
      transition: color 0.15s;
      flex: 1;
    }

    .short-url-container a:hover {
      color: #93c5fd;
      text-decoration: underline;
    }

    .short-url-container .placeholder-text {
      color: #64748b;
      font-style: italic;
      font-weight: 400;
    }

    .copy-btn {
      background: transparent;
      border: 1px solid #334155;
      color: #cbd5e1;
      border-radius: 0.8rem;
      padding: 0.6rem 1rem;
      font-size: 0.9rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .copy-btn:hover {
      background: #334155;
      border-color: #475569;
      color: #f1f5f9;
    }

    .copy-btn.copied {
      background: #10b981;
      border-color: #10b981;
      color: white;
    }

    .copy-btn i {
      font-size: 0.95rem;
    }

    .error-message {
      color: #f87171;
      background: rgba(239, 68, 68, 0.1);
      border-left: 4px solid #ef4444;
      padding: 0.8rem 1rem;
      border-radius: 0.8rem;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .footer-note {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.8rem;
      color: #475569;
      border-top: 1px solid #1e293b;
      padding-top: 1.5rem;
    }

    .footer-note i {
      color: #3b82f6;
    }

    .spinner {
      display: inline-block;
      width: 1rem;
      height: 1rem;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Small toast for auto-copy notification (optional, subtle) */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(1rem);
      background: #10b981;
      color: white;
      padding: 0.8rem 1.5rem;
      border-radius: 3rem;
      font-size: 0.9rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
      z-index: 999;
    }

    .toast.show {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    .toast i {
      font-size: 1.1rem;
    }

    @media (max-width: 480px) {
      .card {
        padding: 1.8rem 1.2rem;
      }
      h1 {
        font-size: 1.8rem;
      }
      .shorten-btn {
        padding: 0.9rem 1.4rem;
        font-size: 1rem;
      }
      .short-url-container {
        flex-wrap: wrap;
      }
      .result-label {
        flex-wrap: wrap;
        gap: 0.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>
      <i class="fas fa-link"></i> TinyLink
    </h1>
    <div class="subhead">
      Shorten & auto-copy — just paste, click, done.
    </div>

    <!-- URL input & button -->
    <div class="input-group">
      <div class="input-wrapper">
        <i class="fas fa-globe"></i>
        <input type="url" id="longUrlInput" placeholder="https://example.com/very/long/path..." autocomplete="off" spellcheck="false">
      </div>
      <button class="shorten-btn" id="shortenBtn">
        <i class="fas fa-scissors"></i> Shorten URL
      </button>
    </div>

    <!-- Result area -->
    <div class="result-area" id="resultArea">
      <div class="result-label">
        <span><i class="fas fa-link"></i> Shortened link</span>
        <span class="auto-copy-badge" id="autoCopyBadge" style="display: none;">
          <i class="fas fa-magic"></i> auto-copied
        </span>
      </div>
      <div class="short-url-container" id="shortUrlContainer">
        <span class="placeholder-text" id="shortUrlPlaceholder">Your short URL will appear here</span>
        <a href="#" id="shortUrlAnchor" style="display: none;" target="_blank" rel="noopener noreferrer"></a>
        <button class="copy-btn" id="copyBtn" style="display: none;">
          <i class="fas fa-copy"></i> Copy
        </button>
      </div>
      <div id="errorContainer"></div>
    </div>

    <div class="footer-note">
      <i class="fas fa-bolt"></i> Powered by TinyURL API · Auto-copy enabled
    </div>
  </div>

  <!-- Toast notification -->
  <div class="toast" id="toast">
    <i class="fas fa-check-circle"></i> <span id="toastMessage">Short link copied!</span>
  </div>

  <script>
    (function() {
      const longUrlInput = document.getElementById('longUrlInput');
      const shortenBtn = document.getElementById('shortenBtn');
      const shortUrlPlaceholder = document.getElementById('shortUrlPlaceholder');
      const shortUrlAnchor = document.getElementById('shortUrlAnchor');
      const copyBtn = document.getElementById('copyBtn');
      const errorContainer = document.getElementById('errorContainer');
      const autoCopyBadge = document.getElementById('autoCopyBadge');
      const toast = document.getElementById('toast');
      const toastMessage = document.getElementById('toastMessage');

      let toastTimeout = null;

      // --- helper: show toast ---
      function showToast(message, isError = false) {
        toastMessage.textContent = message;
        toast.style.background = isError ? '#ef4444' : '#10b981';
        toast.querySelector('i').className = isError ? 'fas fa-exclamation-circle' : 'fas fa-check-circle';
        
        toast.classList.add('show');
        
        if (toastTimeout) clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
          toast.classList.remove('show');
        }, 2600);
      }

      // --- helper: show error ---
      function showError(message) {
        errorContainer.innerHTML = `
          <div class="error-message">
            <i class="fas fa-exclamation-circle"></i> ${message}
          </div>
        `;
      }

      // --- clear error ---
      function clearError() {
        errorContainer.innerHTML = '';
      }

      // --- reset short url display ---
      function resetShortUrlDisplay() {
        shortUrlAnchor.style.display = 'none';
        shortUrlAnchor.href = '#';
        shortUrlAnchor.textContent = '';
        shortUrlPlaceholder.style.display = 'inline';
        copyBtn.style.display = 'none';
        copyBtn.classList.remove('copied');
        copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copy';
        autoCopyBadge.style.display = 'none';
      }

      // --- show generated short url ---
      function displayShortUrl(shortUrl) {
        shortUrlPlaceholder.style.display = 'none';
        shortUrlAnchor.style.display = 'inline';
        shortUrlAnchor.href = shortUrl;
        shortUrlAnchor.textContent = shortUrl;
        copyBtn.style.display = 'flex';
        copyBtn.classList.remove('copied');
        copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copy';
        // Show the auto-copy badge
        autoCopyBadge.style.display = 'inline-flex';
      }

      // --- validate url ---
      function isValidHttpUrl(string) {
        try {
          const url = new URL(string);
          return url.protocol === 'http:' || url.protocol === 'https:';
        } catch (_) {
          return false;
        }
      }

      // --- copy to clipboard (with fallback) ---
      async function copyToClipboard(text) {
        try {
          // Modern API
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
            return true;
          } else {
            // Fallback for insecure contexts / older browsers
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-9999px';
            textArea.style.top = '0';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            const successful = document.execCommand('copy');
            document.body.removeChild(textArea);
            return successful;
          }
        } catch (err) {
          console.warn('Copy failed:', err);
          return false;
        }
      }

      // --- handle shorten + auto copy ---
      async function shortenUrl() {
        const rawUrl = longUrlInput.value.trim();
        
        clearError();

        if (!rawUrl) {
          showError('Please enter a URL.');
          resetShortUrlDisplay();
          return;
        }

        let urlToShorten = rawUrl;
        if (!/^https?:\/\//i.test(rawUrl)) {
          urlToShorten = 'https://' + rawUrl;
        }

        if (!isValidHttpUrl(urlToShorten)) {
          showError('Please enter a valid URL (e.g., https://example.com)');
          resetShortUrlDisplay();
          return;
        }

        // Disable button & loading state
        const originalBtnHtml = shortenBtn.innerHTML;
        shortenBtn.disabled = true;
        shortenBtn.innerHTML = '<span class="spinner"></span> Shortening...';
        resetShortUrlDisplay();

        try {
          const apiEndpoint = `https://tinyurl.com/api-create.php?url=${encodeURIComponent(urlToShorten)}`;
          
          const response = await fetch(apiEndpoint);
          
          if (!response.ok) {
            throw new Error(`TinyURL responded with ${response.status}`);
          }

          const shortUrl = await response.text();

          if (!shortUrl || !shortUrl.startsWith('http')) {
            throw new Error('Invalid short URL received');
          }

          // Show result
          displayShortUrl(shortUrl);
          clearError();

          // ✨ AUTO-COPY: Copy the short URL to clipboard immediately
          const copied = await copyToClipboard(shortUrl);
          
          if (copied) {
            // Update copy button state to "Copied!" temporarily
            copyBtn.classList.add('copied');
            copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied!';
            setTimeout(() => {
              copyBtn.classList.remove('copied');
              copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copy';
            }, 2500);
            // Show toast notification
            showToast('Short link auto-copied!');
          } else {
            // If auto-copy fails, show a subtle warning (but don't break the UI)
            showToast('Could not auto-copy. Click "Copy" manually.', true);
          }

        } catch (error) {
          console.error('Shorten error:', error);
          showError(error.message.includes('fetch') ? 'Network error. Please try again.' : error.message || 'Failed to shorten URL. Please try again.');
          resetShortUrlDisplay();
          showToast('Failed to shorten URL', true);
        } finally {
          shortenBtn.disabled = false;
          shortenBtn.innerHTML = originalBtnHtml;
        }
      }

      // --- manual copy button handler ---
      copyBtn.addEventListener('click', async () => {
        const shortLink = shortUrlAnchor.href;
        if (!shortLink || shortLink === '#') return;
        
        const success = await copyToClipboard(shortLink);
        if (success) {
          copyBtn.classList.add('copied');
          copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied!';
          showToast('Copied to clipboard!');
          setTimeout(() => {
            copyBtn.classList.remove('copied');
            copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copy';
          }, 2000);
        } else {
          showError('Could not copy to clipboard. Please copy manually.');
          showToast('Copy failed', true);
        }
      });

      // --- enter key triggers shorten ---
      longUrlInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          shortenUrl();
        }
      });

      // --- button click ---
      shortenBtn.addEventListener('click', shortenUrl);

      // --- initialize ---
      resetShortUrlDisplay();

      // Optional: Prefill with a demo URL to make testing easier (comment out if unwanted)
      // longUrlInput.value = 'https://github.com/vercel/vercel';
    })();
  </script>
</body>
</html>
